    <script src="RandomBeeMotion.js"></script>

    <script src="utilities.js"></script>
    <script src="flowers.js"></script>

<body>

    <script>
        ///////////////////////////////////////////////////////////////////////////////
        //                              Task parameters
        ///////////////////////////////////////////////////////////////////////////////
        var EXPERIMENT_WIDTH = 600;
        var MINIMUM_VALID_RT = 250;   // minimum valid reaction time (ms)

        var confidence_levels = 5;
        var confidence_labels = ['Guess', '', '', '', 'Confident'];

        // trial numbers
        var n_decision_practice = 1; // number of decision trials for practice
        var n_confidence_practice = 1; // number of confidence trials for practice
        var n_block = 2; // number of blocks in the main task
        var n_per_block = 2;
        var n_main = n_block * n_per_block; // number of main trials

        
        // basic RDM parameters
        var RDM_DotSpeed = 2;
        var RDM_numDots = 100;
        var RDM_duration = 1000;
        var example_coherence = 0.6; // coherence for the example RDM
        var example_direction = Math.PI; // direction for the example RDM (left)

        // RDM dimensions
        var RDM_radius = 150;
        var RDM_box_width = 500;
        var RDM_box_height = 500;
        var RDM_Dot_size = 16; // size of the dots

        // images
        var backgroundImage = 'img/meadow.jpg';
        var RDM_bg_opacity = 0.2; // opacity of the background image (larger means more opaque)
        var dotImage = 'img/imgBee.png';

        // staircase parameters
        var coherence = 0.25; // starting coherence level
        var step_size = 0.05; // initial step size
        var min_step_size = 0.01; // minimum step size

        var stairCaseUp = 0;
        var stairCaseDown = 0;
        var min_coherence = 0.01; // minimum coherence level
        var max_coherence = 0.95;

        var reversal_step_reduction = 0.75; // factor to reduce step size after reversals
        var convergence_reversals = 4; // number of reversals before reducing step size
        var reversals = []; // track all reversal points
        var previous_direction = 0; // -1 = getting easier, 1 = getting harder, 0 = no change

        var results_precision = 3;  // the number of digits to print SDT stats
        
        // basic WM parameters
        WM_duration = 2000; // duration of WM stimulus
        post_stimulus_gap = 500; // gap (ms) between WM stimulus and response screen
        var wm_stimuli_params = [];

        // WM dimensions
        var WM_box_width = 800;
        var WM_box_height = 500;
        var WM_stimuli_size = 150;
        // WM staircase parameters
        var set_size= 2; // starting set size
        var max_set_size = 6; // maximum set size
        var min_set_size = 2; // minimum set size
        var step_size_WM = 1; // initial step size

        ///////////////////////////////////////////////////////////////////////////////
        //                          Initialize jsPsych/JATOS
        ///////////////////////////////////////////////////////////////////////////////
        var JATOS = false;  // if true, load JATOS. use 'false' to run on a local server
        if (JATOS) {
            let script = document.createElement('script');
            script.type = 'text/javascript';
            script.src = 'jatos.js';

        }

        // initialize jsPsych
        var jsPsych = initJsPsych({
            experiment_width: EXPERIMENT_WIDTH,
            minimum_valid_rt: MINIMUM_VALID_RT,
            on_finish: function (data) {

                // Display completion screen
                jsPsych.getDisplayElement().innerHTML = `
                    <div>
                        <p>Thanks for completing this experiment!</p>
                        <p>
                            <button id="save" class="jspsych-btn" onclick="jsPsych.data.get().localSave('csv', 'experiment_data_${participant_id}.csv')">
                                Click here to download your data as a CSV file.
                            </button>
                        </p>
                    </div>
                    <br>
                    <div>
                        Analyzing confidence data...<span id="done"></span><br>
                        <span id="results"></span>
                    </div>
                    `;

                // Analyze confidence data
                import("./metad.js")
                    .then(metad => metad.analyze({
                        data: standata(),
                        num_chains: 4,
                        num_samples: 1000,
                        num_warmup: 250,
                    }))
                    // get posterior quantiles
                    .then(draws => objMap(draws, a => math.quantileSeq(a, [.5, .025, .975]).map(x => x.toFixed(results_precision))))
                    // print to screen (TODO: maybe add jsPsych.addProperties()? )
                    .then(draws => {
                        ['d_prime', 'c', 'log_M'].forEach(param => {
                            document.getElementById('results').innerHTML +=
                                `<br><strong>${param}:</strong> ${draws[param][0]} [${draws[param][1]}, ${draws[param][2]}]`;
                        });
                        document.getElementById('done').innerHTML = 'done!';
                    }).catch((err) => {
                        // print errors to the screen
                        document.getElementById('results').innerHTML = 
                            '<br>There has been an error while analyzing the confidence data: ' + err;
                    });

                // Use this to save data via JATOS
                if (JATOS) {
                    jatos.endStudy(data.csv());
                }
            }
        });

        ///////////////////////////////////////////////////////////////////////////////
        //                            Randomized Conditions
        ///////////////////////////////////////////////////////////////////////////////
        function createTaskVariables(n) {
            return jsPsych.randomization.shuffle(seq(1, n).map(i => ({
                // pseudo-randomly assign target side
                target: i < n / 2 ? 'left' : 'right'
            }))
            ).map((o, i) => {
                o.trial = i + 1; // assign trial number after shuffling
                return o;
            });
        }
        var rdm_decision_practice_variables = createTaskVariables(n_decision_practice);
        var rdm_confidence_practice_variables = createTaskVariables(n_confidence_practice);
        var rdm_main_task_variables = createTaskVariables(n_main);
        var wm_decision_practice_variables = createTaskVariables(n_decision_practice);
        var wm_confidence_practice_variables = createTaskVariables(n_confidence_practice);
        var wm_main_task_variables = createTaskVariables(n_main);

        function splitIntoBlocks(variables, n_block) {
            const blocks = [];

            for (let i = 0; i < n_block; i++) {
                const block_vars = variables.slice(i * n_per_block, (i + 1) * n_per_block);
                block_vars.forEach((v, j) => {
                    v.block = i + 1;
                    v.trial_in_block = j + 1;
                });
                blocks.push(block_vars);
            }
            return blocks;
        }

        var rdm_main_task_block_variables = splitIntoBlocks(rdm_main_task_variables, n_block);
        var wm_main_task_block_variables = splitIntoBlocks(wm_main_task_variables, n_block);
        
        // Define task selection and order 
        var task_seq = jsPsych.randomization.shuffle(['rdm','wm']);//'rdm', 'wm'

        // create experiment timeline
        ///////////////////////////////////////////////////////////////////////////////
        //                     Randomize participant-level data
        ///////////////////////////////////////////////////////////////////////////////
        var participant_id = jsPsych.randomization.randomID(15);
        jsPsych.data.addProperties({
            participant_id: participant_id
        });   
    </script>
    <script src="experiment.js"></script>
    <script>
        ///////////////////////////////////////////////////////////////////////////////
        //                         Launch experiment
        ///////////////////////////////////////////////////////////////////////////////
        //var timeline = [];
        var run = function() {
            jsPsych.run([
                //fullscreen(true), 
                //preload,
                //browser_check, information, consent,
                general_instructions,
                experiment
                //fullscreen(false), age, gender, attn_check, comments  // post-experiment questions
            ]);
        }

        // run jsPsych
        if (JATOS) {
            jatos.onLoad(run);
        } else {
            run();
        }
    </script>
</body>

</html>
